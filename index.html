<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Volley Manager PRO v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<style>
    :root { --primary: #1e3a8a; --secondary: #f39c12; --bg: #f4f6f8; --accent: #2563eb; }
    body { font-family: 'Segoe UI', sans-serif; margin:0; background: var(--bg); padding-bottom: 80px; }
    header { background: var(--primary); color:white; padding:20px; text-align:center; font-weight: bold; border-bottom: 4px solid var(--secondary); }

    .nav { display:flex; justify-content:space-around; background:#fff; padding:12px; border-top:1px solid #ccc; position:fixed; bottom:0; width:100%; z-index: 1000; }
    .nav button { background:none; border:none; font-size:20px; cursor: pointer; }

    .container { padding:15px; max-width: 800px; margin: auto; }
    .card { background:white; padding:20px; margin-bottom:15px; border-radius:12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .hidden { display:none; }
    
    /* Form Giocatrici */
    .form-group { display: grid; gap: 10px; margin-bottom: 15px; }
    input, select { padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; width: 100%; box-sizing: border-box; }
    
    /* Lista Giocatrici */
    .player-card { 
        display: flex; justify-content: space-between; align-items: center; 
        padding: 12px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px;
        background: #fafafa;
    }
    .player-info b { color: var(--primary); display: block; }
    .player-info small { color: #666; }
    .role-badge { 
        background: var(--secondary); color: white; padding: 2px 8px; 
        border-radius: 4px; font-size: 11px; text-transform: uppercase; margin-right: 5px;
    }

    button.main-btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; cursor: pointer; font-weight: bold; }
    button.delete-btn { background: #fee2e2; color: #dc2626; border: none; padding: 8px; border-radius: 6px; cursor: pointer; }

    /* Lavagna e Grafici */
    .court { width: 100%; max-width: 300px; height: 450px; background: #e67e22; margin: 20px auto; position: relative; border: 3px solid white; }
    .player-icon { width: 35px; height: 35px; background: var(--primary); color: white; border-radius: 50%; position: absolute; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: move; border: 2px solid white; touch-action: none; }
</style>
</head>
<body>

<header>🏐 Volley Manager PRO</header>

<div class="container">

    <!-- SEZIONE CALENDARIO -->
    <div id="home">
        <div class="card">
            <h3>📅 Calendario</h3>
            <div id="calendar"></div>
        </div>
    </div>

    <!-- SEZIONE SQUADRA (AGGIORNATA) -->
    <div id="team" class="hidden">
        <div class="card">
            <h3>👥 Nuova Giocatrice</h3>
            <div class="form-group">
                <input id="pName" placeholder="Nome e Cognome">
                <select id="pRole">
                    <option value="">Seleziona Ruolo</option>
                    <option value="Palleggiatore">Palleggiatore</option>
                    <option value="Schiacciatore">Schiacciatore</option>
                    <option value="Centrale">Centrale</option>
                    <option value="Opposto">Opposto</option>
                    <option value="Libero">Libero</option>
                </select>
                <input type="date" id="pBirth" title="Data di Nascita">
                <button class="main-btn" onclick="addPlayer()">Aggiungi alla Squadra</button>
            </div>
        </div>
        <div class="card">
            <h3>Lista Atlete</h3>
            <div id="playersList"></div>
        </div>
    </div>

    <!-- SEZIONE STATISTICHE -->
    <div id="stats" class="hidden">
        <div class="card">
            <h3>📊 Grafico Presenze</h3>
            <canvas id="attendanceChart" height="200"></canvas>
        </div>
    </div>

    <!-- SEZIONE TATTICA -->
    <div id="tactics" class="hidden">
        <div class="card" style="text-align: center;">
            <h3>📋 Lavagna Tattica</h3>
            <div class="court" id="volleyCourt">
                <div style="position: absolute; top: 50%; width: 100%; height: 2px; background: white;"></div>
                <div class="player-icon" style="top:75%; left:45%" onmousedown="dragElement(this)">6</div>
                <div class="player-icon" style="top:10%; left:45%" onmousedown="dragElement(this)">3</div>
                <div class="player-icon" style="top:30%; left:15%" onmousedown="dragElement(this)">4</div>
                <div class="player-icon" style="top:30%; right:15%" onmousedown="dragElement(this)">2</div>
                <div class="player-icon" style="top:75%; left:10%" onmousedown="dragElement(this)">5</div>
                <div class="player-icon" style="top:75%; right:10%" onmousedown="dragElement(this)">1</div>
            </div>
            <p><small>Trascina i numeri per creare lo schema</small></p>
        </div>
    </div>

</div>

<div class="nav">
    <button onclick="showPage('home')">🏠</button>
    <button onclick="showPage('team')">👥</button>
    <button onclick="showPage('tactics')">🏐</button>
    <button onclick="showPage('stats')">📊</button>
</div>

<script>
let players = JSON.parse(localStorage.getItem("players")) || [];
let trainings = JSON.parse(localStorage.getItem("trainings")) || [];
let myChart = null;

function showPage(page) {
    document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
    document.getElementById(page).classList.remove('hidden');
    if(page === 'home') renderCalendar();
    if(page === 'team') renderPlayers();
    if(page === 'stats') renderStats();
}

// --- LOGICA GIOCATRICI ---
function addPlayer() {
    const name = document.getElementById("pName").value;
    const role = document.getElementById("pRole").value;
    const birth = document.getElementById("pBirth").value;

    if (!name || !role) { alert("Inserisci almeno nome e ruolo!"); return; }

    players.push({ name, role, birth, id: Date.now() });
    localStorage.setItem("players", JSON.stringify(players));
    
    // Reset form
    document.getElementById("pName").value = "";
    document.getElementById("pRole").value = "";
    document.getElementById("pBirth").value = "";
    
    renderPlayers();
}

function removePlayer(id) {
    players = players.filter(p => p.id !== id);
    localStorage.setItem("players", JSON.stringify(players));
    renderPlayers();
}

function renderPlayers() {
    const list = document.getElementById("playersList");
    list.innerHTML = players.map(p => `
        <div class="player-card">
            <div class="player-info">
                <b>${p.name}</b>
                <span class="role-badge">${p.role}</span>
                <small>${p.birth ? '🎂 ' + new Date(p.birth).toLocaleDateString('it-IT') : ''}</small>
            </div>
            <button class="delete-btn" onclick="removePlayer(${p.id})">🗑️</button>
        </div>
    `).join("");
}

// --- CALENDARIO E ALTRO ---
function renderCalendar() {
    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'it',
        events: trainings.map(t => ({ title: 'Allenamento', start: t.date })),
        dateClick: function(info) {
            if(confirm("Segnare allenamento il " + info.dateStr + "?")) {
                trainings.push({ id: Date.now(), date: info.dateStr, attendance: {} });
                localStorage.setItem("trainings", JSON.stringify(trainings));
                renderCalendar();
            }
        }
    });
    calendar.render();
}

function renderStats() {
    const ctx = document.getElementById('attendanceChart').getContext('2d');
    if (myChart) myChart.destroy();
    myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: players.map(p => p.name),
            datasets: [{
                label: '% Presenze',
                data: players.map(() => Math.floor(Math.random() * 101)), // Esempio dato che mancano i dati reali
                backgroundColor: '#1e3a8a'
            }]
        }
    });
}

// Trascina elementi (Tattica)
function dragElement(elmnt) {
    var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
    elmnt.onmousedown = dragMouseDown;
    elmnt.ontouchstart = dragMouseDown;

    function dragMouseDown(e) {
        e = e || window.event;
        pos3 = e.clientX || e.touches[0].clientX;
        pos4 = e.clientY || e.touches[0].clientY;
        document.onmouseup = closeDragElement;
        document.ontouchend = closeDragElement;
        document.onmousemove = elementDrag;
        document.ontouchmove = elementDrag;
    }

    function elementDrag(e) {
        e = e || window.event;
        let cx = e.clientX || e.touches[0].clientX;
        let cy = e.clientY || e.touches[0].clientY;
        pos1 = pos3 - cx; pos2 = pos4 - cy;
        pos3 = cx; pos4 = cy;
        elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
        elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
    }

    function closeDragElement() {
        document.onmouseup = null; document.onmousemove = null;
    }
}

window.onload = () => { renderCalendar(); };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Volley Manager Cloud Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <style>
        :root { --primary: #1e3a8a; --secondary: #f59e0b; --bg: #f1f5f9; --white: #ffffff; --danger: #ef4444; }
        body { font-family: 'Inter', sans-serif; margin:0; background: var(--bg); color: #1e293b; padding-bottom: 80px; overflow-x: hidden; }
        header { background: var(--primary); color: white; padding: 1rem; text-align: center; font-weight: bold; border-bottom: 4px solid var(--secondary); font-size: 1.2rem; }
        .container { padding: 15px; max-width: 900px; margin: auto; }
        .card { background: var(--white); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; position: relative; }
        .section-title { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; color: var(--primary); font-weight: 700; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
        
        #calendar { min-height: 400px; background: white; padding: 10px; border-radius: 8px; }
        
        /* Navigation Bar */
        .nav { display:flex; justify-content:space-around; background:var(--white); padding:10px 0; border-top:2px solid #e2e8f0; position:fixed; bottom:0; width:100%; z-index: 4000; box-shadow: 0 -4px 10px rgba(0,0,0,0.05); }
        .nav button { background:none; border:none; font-size:24px; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: #64748b; transition: color 0.2s; }
        .nav button.active { color: var(--primary); font-weight: bold; }
        .nav button span { font-size: 11px; margin-top: 2px; }

        /* --- Lavagna Tattica Pro --- */
        .tactics-layout { display: flex; align-items: flex-start; justify-content: center; gap: 15px; position: relative; min-height: 520px; margin-top: 10px; }
        .bench { width: 65px; min-height: 500px; background: #e2e8f0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 10px; border: 2px dashed #cbd5e1; z-index: 5; }
        .court-container { position: relative; width: 300px; height: 500px; background: #2563eb; border: 4px solid white; border-radius: 8px; z-index: 10; box-shadow: 0 4px 10px rgba(0,0,0,0.15); overflow: hidden; }
        #tacticsCanvas { position: absolute; top: 0; left: 0; z-index: 11; pointer-events: none; }
        
        .player-circle { width: 36px; height: 36px; background: var(--primary); color: white; border-radius: 50%; position: absolute; display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 100; cursor: move; border: 2px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.3); font-size: 14px; touch-action: none; user-select: none; }
        .bench .player-circle { position: relative; top: auto !important; left: auto !important; }

        .btn-main { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 600; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn-main:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger) !important; margin-top: 5px; }
        .btn-warning { background: var(--secondary) !important; color: white; margin-top: 5px; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; z-index: 5000; backdrop-filter: blur(3px); }
        .modal-content { background: white; margin: 10% auto; padding: 25px; width: 85%; max-width: 450px; border-radius: 16px; max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .hidden { display: none !important; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 15px; }
        
        /* Modifica layout lista atlete */
        .player-item { display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid #f1f5f9; }
        .player-info { display: flex; flex-direction: column; gap: 2px; }
        .player-role-sub { font-size: 13px; color: #64748b; font-weight: 500; }
        .player-item button { background: none; border: none; font-size: 18px; cursor: pointer; padding: 5px; }
    </style>
</head>
<body>

<header>🏐 Volley Manager Cloud Pro</header>

<div class="container">
    <div id="home">
        <div class="card"><div class="section-title"><span>📅</span> Calendario Allenamenti</div><div id="calendar"></div></div>
        <div class="card"><div class="section-title"><span>📊</span> Statistiche Presenze Squadra</div><div style="height: 250px;"><canvas id="statsChart"></canvas></div></div>
    </div>

    <div id="team" class="hidden">
        <div class="card">
            <h3 style="margin-top:0; color: var(--primary);">Gestione Atleta</h3>
            <div style="display: flex; gap: 10px;">
                <div style="flex: 3;"><input id="pName" placeholder="Nome e Cognome atleta"></div>
                <div style="flex: 1;"><input id="pNumber" type="number" placeholder="N° Maglia" min="0" max="99"></div>
            </div>
            <select id="pRole">
                <option value="P">Palleggiatore (P)</option>
                <option value="S">Schiacciatore (S)</option>
                <option value="C">Centrale (C)</option>
                <option value="O">Opposto (O)</option>
                <option value="L">Libero (L)</option>
            </select>
            <input type="hidden" id="editingId">
            <button class="btn-main" onclick="savePlayer()">Salva Inserimento</button>
        </div>
        <div class="card">
            <div class="section-title"><span>👥</span> Lista Atlete</div>
            <div id="fullPlayerList"></div>
        </div>
    </div>

    <div id="tactics" class="hidden">
        <div class="card">
            <div class="section-title"><span>📋</span> Lavagna Tattica Orientabile</div>
            
            <div class="tactics-layout" id="tacticsLayout">
                <div class="bench" id="playerBench">
                    <div class="player-circle" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">P</div>
                    <div class="player-circle" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">C</div>
                    <div class="player-circle" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">C</div>
                    <div class="player-circle" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">S</div>
                    <div class="player-circle" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">S</div>
                    <div class="player-circle" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">O</div>
                    <div class="player-circle" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">L</div>
                </div>

                <div class="court-container" id="courtFrame">
                    <canvas id="tacticsCanvas" width="300" height="500"></canvas>
                    
                    <div class="player-circle" style="top:380px; left:132px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">6</div>
                    <div class="player-circle" style="top:180px; left:132px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">3</div>
                    <div class="player-circle" style="top:180px; left:30px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">4</div>
                    <div class="player-circle" style="top:180px; right:30px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">2</div>
                    <div class="player-circle" style="top:380px; left:30px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">5</div>
                    <div class="player-circle" style="top:380px; right:30px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">1</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="trainingModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:var(--primary);">Nuovo Allenamento</h3>
        <p style="font-weight: bold; background:#e2e8f0; padding:8px; border-radius:5px;" id="selDateText"></p>
        <div style="display: flex; gap: 10px;">
            <div style="flex:1;"><label>Inizio:</label><input type="time" id="startTime" value="18:30"></div>
            <div style="flex:1;"><label>Fine:</label><input type="time" id="endTime" value="20:30"></div>
        </div>
        <label style="margin-top:10px; display:block;">Ripeti settimanalmente per X settimane:</label>
        <input type="number" id="repeatWeeks" value="1" min="1">
        <button class="btn-main" onclick="saveTraining()">Crea Sessione/i</button>
        <button onclick="closeModal('trainingModal')" style="width:100%; border:none; background:none; margin-top:12px; color:#64748b; cursor:pointer;">Annulla</button>
    </div>
</div>

<div id="attModal" class="modal">
    <div class="modal-content">
        <h3 id="attTitle" style="margin-top:0; color:var(--primary);">Appello</h3>
        <button class="btn-main" style="background:#10b981; margin-bottom:15px;" onclick="setAllPresent()">✅ Tutte Presenti</button>
        <div id="attPlayersList" style="max-height: 200px; overflow-y:auto; padding-right:5px;"></div>
        <hr style="border:0; border-top:1px solid #e2e8f0; margin:15px 0;">
        <button class="btn-main btn-danger" onclick="deleteTraining()">Elimina Solo Oggi</button>
        <button class="btn-main btn-warning" onclick="deleteSeries()">Elimina Intera Serie</button>
        <button class="btn-main" onclick="closeModal('attModal')" style="background: #64748b;">Esci senza salvare</button>
    </div>
</div>

<div class="nav">
    <button id="nav-home" class="active" onclick="showPage('home')">🏠<span>Home</span></button>
    <button id="nav-team" onclick="showPage('team')">👥<span>Squadra</span></button>
    <button id="nav-tactics" onclick="showPage('tactics')">📋<span>Lavagna</span></button>
</div>

<script>
const CLOUD_URL = "https://script.google.com/macros/s/AKfycbw7S3mr9f2cY370nC7bl3bLLe21r9y8OQu1-tRbMX-7opzUYzMVCA42mvLIZ7F1E6en/exec";
let players = [], trainings = [], selectedDate = "", currentTid = null, calendar = null, statsChart = null;

// Mappatura dei ruoli per la visualizzazione estesa
const roleLabels = {
    "P": "Palleggiatore",
    "S": "Schiacciatore",
    "C": "Centrale",
    "O": "Opposto",
    "L": "Libero"
};

function formatDate(date) {
    let d = new Date(date), month = '' + (d.getMonth() + 1), day = '' + d.getDate(), year = d.getFullYear();
    if (month.length < 2) month = '0' + month;
    if (day.length < 2) day = '0' + day;
    return [year, month, day].join('-');
}

async function syncToCloud() {
    try { 
        await fetch(CLOUD_URL, { method: "POST", body: JSON.stringify({players, trainings}) }); 
        renderCalendar(); 
        updateStats();
    } catch(e) { console.error("Errore sincronizzazione cloud:", e); }
}

async function loadFromCloud() {
    try {
        const res = await fetch(CLOUD_URL); 
        const data = await res.json();
        if(data) { 
            players = data.players || []; 
            trainings = data.trainings || []; 
        }
        renderFullList(); 
        showPage('home');
    } catch(e) { 
        showPage('home'); 
    }
}

    document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
    document.getElementById(page).classList.remove('hidden');
    
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('nav-' + page).classList.add('active');

    if(page

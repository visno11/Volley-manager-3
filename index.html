<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Volley Manager Cloud Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <style>
        :root { --primary: #1e3a8a; --secondary: #f59e0b; --bg: #f1f5f9; --white: #ffffff; --edit: #10b981; }
        body { font-family: 'Inter', sans-serif; margin:0; background: var(--bg); color: #1e293b; padding-bottom: 80px; overflow-x: hidden; }
        header { background: var(--primary); color: white; padding: 1rem; text-align: center; font-weight: bold; border-bottom: 4px solid var(--secondary); }
        .container { padding: 15px; max-width: 900px; margin: auto; }
        .card { background: var(--white); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; position: relative; }
        .section-title { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; color: var(--primary); font-weight: 700; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
        
        /* FIX Calendario */
        #calendar { min-height: 400px; background: white; padding: 10px; border-radius: 8px; }
        
        .nav { display:flex; justify-content:space-around; background:var(--white); padding:15px; border-top:1px solid #ccc; position:fixed; bottom:0; width:100%; z-index: 4000; }
        .nav button { background:none; border:none; font-size:24px; cursor: pointer; }
        
        /* Lavagna Tattica */
        .tactics-layout { display: flex; align-items: flex-start; justify-content: center; gap: 10px; position: relative; min-height: 520px; }
        .bench { width: 60px; height: 500px; background: #e2e8f0; border-radius: 8px; display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 10px; border: 2px dashed #cbd5e1; z-index: 5; }
        .court-container { position: relative; width: 300px; height: 500px; background: #3b82f6; border: 5px solid white; border-radius: 4px; z-index: 10; }
        #tacticsCanvas { position: absolute; top: 0; left: 0; z-index: 11; cursor: crosshair; }
        .player-circle { width: 34px; height: 34px; background: var(--primary); color: white; border-radius: 50%; position: absolute; display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 100; cursor: move; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.4); font-size: 14px; touch-action: none; }
        .bench .player-circle { position: relative; top: auto !important; left: auto !important; }

        .toolbar { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .btn-t { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; background: white; cursor: pointer; font-weight: bold; }
        .btn-t.active { background: var(--secondary); color: white; border-color: var(--secondary); }
        
        .btn-main { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-all { background: #10b981; margin-bottom: 15px; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 5000; }
        .modal-content { background: white; margin: 10% auto; padding: 20px; width: 90%; max-width: 500px; border-radius: 15px; max-height: 80vh; overflow-y: auto; }
        .sync-status { font-size: 0.7rem; color: #10b981; text-align: center; margin-top: 5px; }
        .hidden { display: none !important; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
    </style>
</head>
<body>

<header>🏐 Volley Manager Cloud
    <div id="syncIndicator" class="sync-status">Sincronizzazione...</div>
</header>

<div class="container">
    <div id="home">
        <div class="card"><div class="section-title"><span>📅</span> Calendario</div><div id="calendar"></div></div>
        <div class="card"><div class="section-title"><span>📊</span> Statistiche Presenze</div><div style="height: 250px;"><canvas id="statsChart"></canvas></div></div>
    </div>

    <div id="team" class="hidden">
        <div class="card">
            <h3>Nuova Atleta</h3>
            <input id="pName" placeholder="Nome completo">
            <select id="pRole">
                <option value="P">Palleggiatore</option>
                <option value="S">Schiacciatore</option>
                <option value="C">Centrale</option>
                <option value="O">Opposto</option>
                <option value="L">Libero</option>
            </select>
            <button class="btn-main" onclick="savePlayer()">Aggiungi</button>
        </div>
        <div class="card" id="fullPlayerList"></div>
    </div>

    <div id="tactics" class="hidden">
        <div class="card">
            <div class="section-title"><span>📋</span> Lavagna Schemi</div>
            <div class="toolbar">
                <button id="btnMove" class="btn-t active" onclick="setTool('move')">🖐️ Muovi</button>
                <button id="btnDraw" class="btn-t" onclick="setTool('draw')">🏹 Frecce</button>
                <button class="btn-t" onclick="clearArrows()">🗑️ Pulisci</button>
            </div>
            
            <div class="tactics-layout" id="tacticsLayout">
                <div class="bench">
                    <div class="player-circle" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">P</div>
                    <div class="player-circle" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">C</div>
                    <div class="player-circle" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">C</div>
                    <div class="player-circle" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">S</div>
                    <div class="player-circle" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">S</div>
                    <div class="player-circle" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">O</div>
                    <div class="player-circle" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">L</div>
                </div>

                <div class="court-container">
                    <canvas id="tacticsCanvas" width="300" height="500"></canvas>
                    <div class="player-circle" style="top:410px; left:133px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">6</div>
                    <div class="player-circle" style="top:55px; left:133px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">3</div>
                    <div class="player-circle" style="top:150px; left:30px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">4</div>
                    <div class="player-circle" style="top:150px; right:30px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">2</div>
                    <div class="player-circle" style="top:410px; left:30px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">5</div>
                    <div class="player-circle" style="top:410px; right:30px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">1</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div id="trainingModal" class="modal"><div class="modal-content"><h3>Nuovo Allenamento</h3><p id="selDateText"></p><input type="time" id="startTime" value="18:30"><button class="btn-main" onclick="saveTraining()">Crea</button><button onclick="closeModal('trainingModal')" style="width:100%; border:none; background:none; margin-top:10px;">Annulla</button></div></div>
<div id="attModal" class="modal"><div class="modal-content"><h3>Appello</h3><button class="btn-main btn-all" onclick="setAllPresent()">✅ Segna Tutte Presenti</button><div id="attPlayersList"></div><button class="btn-main" onclick="closeModal('attModal')">Salva e Chiudi</button></div></div>

<div class="nav"><button onclick="showPage('home')">🏠</button><button onclick="showPage('team')">👥</button><button onclick="showPage('tactics')">🏐</button></div>

<script>
const CLOUD_URL = "https://script.google.com/macros/s/AKfycbw7S3mr9f2cY370nC7bl3bLLe21r9y8OQu1-tRbMX-7opzUYzMVCA42mvLIZ7F1E6en/exec";
let players = [], trainings = [], selectedDate = "", currentTid = null, currentTool = 'move', statsChart = null, calendar = null;

async function syncToCloud() {
    document.getElementById('syncIndicator').innerText = "Sincronizzazione...";
    try {
        await fetch(CLOUD_URL, { method: "POST", body: JSON.stringify({players, trainings}) });
        document.getElementById('syncIndicator').innerText = "Dati Salvati";
        renderCalendar(); // Aggiorna i numeri sul calendario dopo il salvataggio
    } catch(e) { document.getElementById('syncIndicator').innerText = "Errore Cloud"; }
}

async function loadFromCloud() {
    try {
        const res = await fetch(CLOUD_URL);
        const data = await res.json();
        if(data) { players = data.players || []; trainings = data.trainings || []; }
        document.getElementById('syncIndicator').innerText = "Dati Caricati";
        showPage('home');
    } catch(e) { document.getElementById('syncIndicator').innerText = "Pronto (Offline)"; showPage('home'); }
}

function showPage(page) {
    document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
    document.getElementById(page).classList.remove('hidden');
    if(page === 'home') { renderCalendar(); updateStats(); }
    if(page === 'tactics') setTimeout(drawVolleyCourt, 50);
}

// LOGICA CALENDARIO CON CONTEGGIO
function renderCalendar() {
    const calendarEl = document.getElementById('calendar');
    if (calendar) calendar.destroy();
    
    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth', locale: 'it', height: 'auto',
        events: trainings.map(t => {
            // Conta le presenti
            const presenti = Object.values(t.attendance).filter(v => v === "presente").length;
            return {
                id: t.id,
                title: `🏐 ${t.startTime} (${presenti}/${players.length})`,
                start: t.date,
                backgroundColor: presenti === players.length ? '#10b981' : '#1e3a8a'
            };
        }),
        dateClick: (info) => { selectedDate = info.dateStr; document.getElementById('selDateText').innerText = info.dateStr; document.getElementById('trainingModal').style.display='block'; },
        eventClick: (info) => openAtt(info.event.id)
    });
    calendar.render();
}

function setAllPresent() {
    const t = trainings.find(x => x.id == currentTid);
    players.forEach(p => { t.attendance[p.name] = "presente"; });
    openAtt(currentTid); syncToCloud();
}

function saveTraining() {
    trainings.push({ id: "T"+Date.now(), date: selectedDate, startTime: document.getElementById('startTime').value, attendance: {} });
    closeModal('trainingModal'); syncToCloud();
}

function openAtt(tid) {
    currentTid = tid; const t = trainings.find(x => x.id == tid);
    document.getElementById('attPlayersList').innerHTML = players.map(p => {
        const s = t.attendance[p.name] || "presente";
        return `<div style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>${p.name}</span>
        <select onchange="updateAtt('${p.name}', this.value)" style="width:auto;">
            <option value="presente" ${s==='presente'?'selected':''}>✅</option>
            <option value="assente" ${s==='assente'?'selected':''}>❌</option>
            <option value="infortunio" ${s==='infortunio'?'selected':''}>🤕</option>
        </select></div>`;
    }).join("");
    document.getElementById('attModal').style.display='block';
}

function updateAtt(pname, status) {
    const t = trainings.find(x => x.id == currentTid);
    t.attendance[pname] = status; syncToCloud();
}

// RESTO DELLE FUNZIONI (SQUADRA & TATTICA)
function savePlayer() {
    const name = document.getElementById("pName").value;
    if(!name) return;
    players.push({ id: Date.now(), name, role: document.getElementById("pRole").value, attendance: {} });
    document.getElementById("pName").value = ""; renderFullList(); syncToCloud();
}
function renderFullList() { document.getElementById("fullPlayerList").innerHTML = players.map(p => `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #eee;"><span>${p.name} (${p.role})</span><button onclick="deletePlayer(${p.id})">🗑️</button></div>`).join(""); }
function deletePlayer(id) { if(confirm("Eliminare?")) { players = players.filter(p => p.id !== id); syncToCloud(); renderFullList(); } }
function updateStats() {
    const ctx = document.getElementById('statsChart').getContext('2d');
    const data = players.map(p => {
        const total = trainings.length; if(total === 0) return 0;
        const pres = trainings.filter(t => t.attendance[p.name] === "presente" || !t.attendance[p.name]).length;
        return Math.round((pres/total)*100);
    });
    if(statsChart) statsChart.destroy();
    statsChart = new Chart(ctx, { type: 'bar', data: { labels: players.map(p => p.name), datasets: [{ label: '% Presenze', data: data, backgroundColor: '#1e3a8a' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } } });
}
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

// LAVAGNA
const canvas = document.getElementById('tacticsCanvas'); const ctx = canvas.getContext('2d');
let drawing = false, startX, startY;
function drawVolleyCourt() {
    ctx.clearRect(0, 0, 300, 500); ctx.strokeStyle = "white"; ctx.lineWidth = 3; ctx.strokeRect(0, 0, 300, 500);
    ctx.beginPath(); ctx.moveTo(0, 250); ctx.lineTo(300, 250); ctx.stroke(); ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(0, 167); ctx.lineTo(300, 167); ctx.moveTo(0, 333); ctx.lineTo(300, 333); ctx.stroke(); ctx.setLineDash([]);
}
function setTool(t) { currentTool = t; document.getElementById('btnMove').classList.toggle('active', t==='move'); document.getElementById('btnDraw').classList.toggle('active', t==='draw'); }
function clearArrows() { drawVolleyCourt(); }
canvas.addEventListener('mousedown', sDraw); canvas.addEventListener('mouseup', eDraw);
canvas.addEventListener('touchstart', (e) => sDraw(e.touches[0])); canvas.addEventListener('touchend', (e) => eDraw(e.changedTouches[0]));
function sDraw(e) { if(currentTool !== 'draw') return; drawing = true; const r = canvas.getBoundingClientRect(); startX = (e.clientX || e.pageX) - r.left; startY = (e.clientY || e.pageY) - r.top; }
function eDraw(e) { if(!drawing) return; const r = canvas.getBoundingClientRect(); drawArrow(startX, startY, (e.clientX || e.pageX) - r.left, (e.clientY || e.pageY) - r.top); drawing = false; }
function drawArrow(fx, fy, tx, ty) { const headlen = 12; const angle = Math.atan2(ty - fy, tx - fx); ctx.strokeStyle = "yellow"; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(tx, ty); ctx.stroke(); ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx - headlen * Math.cos(angle - Math.PI / 6), ty - headlen * Math.sin(angle - Math.PI / 6)); ctx.moveTo(tx, ty); ctx.lineTo(tx - headlen * Math.cos(angle + Math.PI / 6), ty - headlen * Math.sin(angle + Math.PI / 6)); ctx.stroke(); }
function dragPlayer(el) {
    el.onmousedown = el.ontouchstart = (e) => {
        if(currentTool !== 'move') return;
        e.preventDefault();
        let x = e.clientX || e.touches[0].clientX; let y = e.clientY || e.touches[0].clientY;
        if(el.parentElement.classList.contains('bench')) {
            const rect = el.getBoundingClientRect(); const parentRect = document.getElementById('tacticsLayout').getBoundingClientRect();
            el.style.position = 'absolute'; el.style.top = (rect.top - parentRect.top) + 'px'; el.style.left = (rect.left - parentRect.left) + 'px';
            document.getElementById('tacticsLayout').appendChild(el);
        }
        document.onmousemove = document.ontouchmove = (ev) => {
            let nx = ev.clientX || ev.touches[0].clientX; let ny = ev.clientY || ev.touches[0].clientY;
            el.style.left = (el.offsetLeft + (nx - x)) + "px"; el.style.top = (el.offsetTop + (ny - y)) + "px";
            x = nx; y = ny;
        };
        document.onmouseup = document.ontouchend = () => { document.onmousemove = document.ontouchmove = null; };
    };
}

window.onload = loadFromCloud;
</script>
</body>
</html>

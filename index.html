<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Volley Manager Cloud Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <style>
        :root { --primary: #1e3a8a; --secondary: #f59e0b; --bg: #f1f5f9; --white: #ffffff; --edit: #10b981; --danger: #ef4444; }
        body { font-family: 'Inter', sans-serif; margin:0; background: var(--bg); color: #1e293b; padding-bottom: 80px; }
        header { background: var(--primary); color: white; padding: 1rem; text-align: center; font-weight: bold; border-bottom: 4px solid var(--secondary); }
        .container { padding: 15px; max-width: 900px; margin: auto; }
        .card { background: var(--white); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; position: relative; }
        .section-title { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; color: var(--primary); font-weight: 700; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
        
        #calendar { min-height: 400px; background: white; padding: 10px; border-radius: 8px; }
        .nav { display:flex; justify-content:space-around; background:var(--white); padding:15px; border-top:1px solid #ccc; position:fixed; bottom:0; width:100%; z-index: 4000; }
        .nav button { background:none; border:none; font-size:24px; cursor: pointer; }
        
        .btn-main { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-danger { background: var(--danger) !important; margin-top: 5px; }
        .btn-edit-small { background: var(--secondary); color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 5000; }
        .modal-content { background: white; margin: 5% auto; padding: 20px; width: 90%; max-width: 500px; border-radius: 15px; max-height: 85vh; overflow-y: auto; }
        .hidden { display: none !important; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        
        .player-item { display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid #eee; }
        .action-btns button { background: none; border: none; font-size: 1.2rem; cursor: pointer; }
    </style>
</head>
<body>

<header>🏐 Volley Manager Cloud Pro</header>

<div class="container">
    <div id="home">
        <div class="card"><div class="section-title"><span>📅</span> Calendario</div><div id="calendar"></div></div>
        <div class="card"><div class="section-title"><span>📊</span> % Presenze (Solo "Presente")</div><div style="height: 250px;"><canvas id="statsChart"></canvas></div></div>
    </div>

    <div id="team" class="hidden">
        <div class="card">
            <h3 id="formTitle">Nuova Atleta</h3>
            <input id="pName" placeholder="Nome completo">
            <input type="date" id="pDob">
            <select id="pRole">
                <option value="P">Palleggiatore</option><option value="S">Schiacciatore</option><option value="C">Centrale</option><option value="O">Opposto</option><option value="L">Libero</option>
            </select>
            <input type="hidden" id="editingId">
            <button class="btn-main" onclick="savePlayer()">Salva Atleta</button>
        </div>
        <div class="card">
            <div class="section-title"><span>👥</span> Elenco Atlete</div>
            <div id="fullPlayerList"></div>
        </div>
    </div>
</div>

<!-- MODALE NUOVO ALLENAMENTO -->
<div id="trainingModal" class="modal">
    <div class="modal-content">
        <h3>Pianifica Allenamento</h3>
        <p id="selDateText" style="font-weight: bold; color: var(--primary);"></p>
        <div style="display: flex; gap: 10px;">
            <div style="flex:1;"><label>Dalle ore:</label><input type="time" id="startTime" value="18:30"></div>
            <div style="flex:1;"><label>Alle ore:</label><input type="time" id="endTime" value="20:30"></div>
        </div>
        <div style="margin-top: 10px; padding: 10px; background: #f8fafc; border-radius: 8px;">
            <label><strong>Ripetizione Settimanale:</strong></label>
            <p style="font-size: 0.8rem; color: #64748b; margin: 4px 0;">Crea un evento ogni 7 giorni a partire dalla data scelta.</p>
            <input type="number" id="repeatWeeks" value="1" min="1" max="52" placeholder="Numero di settimane">
            <small>Inserisci 1 per evento singolo, o più settimane per ripetere.</small>
        </div>
        <button class="btn-main" onclick="saveTraining()">Conferma e Crea</button>
        <button onclick="closeModal('trainingModal')" style="width:100%; border:none; background:none; margin-top:10px; cursor:pointer;">Annulla</button>
    </div>
</div>

<!-- MODALE APPELLO -->
<div id="attModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 id="attTitle">Appello</h3>
            <button class="btn-edit-small" onclick="editTrainingTime()">Modifica Orari</button>
        </div>
        <button class="btn-main" style="background:#10b981; margin-bottom:15px;" onclick="setAllPresent()">✅ Segna Tutte Presenti</button>
        <div id="attPlayersList"></div>
        <hr>
        <button class="btn-main" onclick="closeModal('attModal')">Chiudi</button>
        <button class="btn-main btn-danger" onclick="deleteTraining()">🗑️ Elimina Allenamento</button>
    </div>
</div>

<div class="nav"><button onclick="showPage('home')">🏠</button><button onclick="showPage('team')">👥</button></div>

<script>
const CLOUD_URL = "https://script.google.com/macros/s/AKfycbw7S3mr9f2cY370nC7bl3bLLe21r9y8OQu1-tRbMX-7opzUYzMVCA42mvLIZ7F1E6en/exec";
let players = [], trainings = [], selectedDate = "", currentTid = null, calendar = null, statsChart = null;

async function syncToCloud() {
    try { await fetch(CLOUD_URL, { method: "POST", body: JSON.stringify({players, trainings}) }); renderCalendar(); updateStats(); } catch(e) { console.error("Errore Cloud"); }
}

async function loadFromCloud() {
    try {
        const res = await fetch(CLOUD_URL); const data = await res.json();
        if(data) { players = data.players || []; trainings = data.trainings || []; }
        renderFullList(); showPage('home');
    } catch(e) { showPage('home'); }
}

function showPage(page) {
    document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
    document.getElementById(page).classList.remove('hidden');
    if(page === 'home') { renderCalendar(); updateStats(); }
}

// CALENDARIO E RIPETIZIONI
function renderCalendar() {
    const calendarEl = document.getElementById('calendar');
    if (calendar) calendar.destroy();
    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth', locale: 'it', height: 'auto',
        events: trainings.map(t => {
            const pres = Object.values(t.attendance || {}).filter(v => v === "presente").length;
            return { id: t.id, title: `${t.startTime}-${t.endTime} (${pres}/${players.length})`, start: t.date };
        }),
        dateClick: (info) => { 
            selectedDate = info.dateStr; 
            document.getElementById('selDateText').innerText = "Data: " + info.dateStr.split('-').reverse().join('/');
            document.getElementById('trainingModal').style.display='block'; 
        },
        eventClick: (info) => openAtt(info.event.id)
    });
    calendar.render();
}

function saveTraining() {
    const start = document.getElementById('startTime').value;
    const end = document.getElementById('endTime').value;
    const reps = parseInt(document.getElementById('repeatWeeks').value) || 1;
    
    // Creazione eventi ogni 7 giorni
    const parts = selectedDate.split('-');
    for(let i=0; i<reps; i++) {
        let d = new Date(parts[0], parts[1]-1, parts[2]);
        d.setDate(d.getDate() + (i * 7));
        
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const dateStr = `${y}-${m}-${day}`;
        
        trainings.push({ 
            id: "T" + Date.now() + i, 
            date: dateStr, 
            startTime: start, 
            endTime: end, 
            attendance: {} 
        });
    }
    closeModal('trainingModal'); syncToCloud();
}

// GESTIONE EVENTO SINGOLO
function editTrainingTime() {
    const s = prompt("Nuovo inizio (HH:MM):");
    const e = prompt("Nuova fine (HH:MM):");
    if(s && e) {
        const t = trainings.find(x => x.id == currentTid);
        t.startTime = s; t.endTime = e;
        syncToCloud(); openAtt(currentTid);
    }
}

function deleteTraining() {
    if(confirm("Vuoi eliminare questo allenamento?")) { 
        trainings = trainings.filter(t => t.id !== currentTid); 
        closeModal('attModal'); syncToCloud(); 
    }
}

// APPELLO CON 5 STATI
function openAtt(tid) {
    currentTid = tid; const t = trainings.find(x => x.id == tid);
    document.getElementById('attTitle').innerText = `Appello: ${t.startTime} - ${t.endTime}`;
    document.getElementById('attPlayersList').innerHTML = players.map(p => {
        const s = t.attendance[p.name] || "presente";
        return `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; border-bottom: 1px solid #f1f5f9; padding-bottom:4px;">
            <span>${p.name}</span>
            <select onchange="updateAtt('${p.name}', this.value)" style="width:auto; padding:4px; font-size:0.9rem;">
                <option value="presente" ${s==='presente'?'selected':''}>✅ Presente</option>
                <option value="assente" ${s==='assente'?'selected':''}>❌ Assente</option>
                <option value="infortunio" ${s==='infortunio'?'selected':''}>🤕 Infortunio</option>
                <option value="malattia" ${s==='malattia'?'selected':''}>🤒 Malattia</option>
                <option value="gita" ${s==='gita'?'selected':''}>🚌 Gita</option>
            </select></div>`;
    }).join("");
    document.getElementById('attModal').style.display='block';
}

function updateAtt(pname, status) {
    const t = trainings.find(x => x.id == currentTid);
    t.attendance[pname] = status; syncToCloud();
}

function setAllPresent() {
    const t = trainings.find(x => x.id == currentTid);
    players.forEach(p => t.attendance[p.name] = "presente");
    openAtt(currentTid); syncToCloud();
}

// ANAGRAFICA ATLETE
function savePlayer() {
    const n = document.getElementById("pName").value, d = document.getElementById("pDob").value, r = document.getElementById("pRole").value, eid = document.getElementById("editingId").value;
    if(!n) return alert("Nome obbligatorio");
    if(eid) {
        const idx = players.findIndex(p => p.id == eid);
        players[idx].name = n; players[idx].dob = d; players[idx].role = r;
    } else {
        players.push({ id: Date.now(), name: n, dob: d, role: r, attendance: {} });
    }
    resetForm(); renderFullList(); syncToCloud();
}

function editPlayer(id) {
    const p = players.find(x => x.id == id);
    document.getElementById("pName").value = p.name; document.getElementById("pDob").value = p.dob || "";
    document.getElementById("pRole").value = p.role; document.getElementById("editingId").value = p.id;
    document.getElementById("formTitle").innerText = "Modifica Atleta"; 
    showPage('team'); window.scrollTo(0,0);
}

function renderFullList() {
    document.getElementById("fullPlayerList").innerHTML = players.map(p => `
        <div class="player-item">
            <div><strong>${p.name}</strong> (${p.role})<br><small>🎂 ${p.dob ? p.dob.split('-').reverse().join('/') : '---'}</small></div>
            <div class="action-btns"><button onclick="editPlayer(${p.id})">✏️</button><button onclick="deletePlayer(${p.id})">🗑️</button></div>
        </div>`).join("");
}

function deletePlayer(id) { if(confirm("Eliminare atleta?")) { players = players.filter(p => p.id !== id); syncToCloud(); renderFullList(); } }
function resetForm() { document.getElementById("pName").value = ""; document.getElementById("pDob").value = ""; document.getElementById("editingId").value = ""; document.getElementById("formTitle").innerText = "Nuova Atleta"; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

// STATISTICHE
function updateStats() {
    const ctx = document.getElementById('statsChart').getContext('2d');
    const data = players.map(p => {
        const total = trainings.length; if(total === 0) return 0;
        const pres = trainings.filter(t => t.attendance[p.name] === "presente").length;
        return Math.round((pres/total)*100);
    });
    if(statsChart) statsChart.destroy();
    statsChart = new Chart(ctx, { type: 'bar', data: { labels: players.map(p => p.name), datasets: [{ label: '% Presenze Reali', data: data, backgroundColor: '#1e3a8a' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } } });
}

window.onload = loadFromCloud;
</script>
</body>
</html>

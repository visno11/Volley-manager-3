<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Volley Manager Cloud Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <style>
        :root { --primary: #1e3a8a; --secondary: #f59e0b; --bg: #f1f5f9; --white: #ffffff; --edit: #10b981; }
        body { font-family: 'Inter', sans-serif; margin:0; background: var(--bg); color: #1e293b; padding-bottom: 80px; }
        header { background: var(--primary); color: white; padding: 1rem; text-align: center; font-weight: bold; border-bottom: 4px solid var(--secondary); }
        .container { padding: 15px; max-width: 900px; margin: auto; }
        .card { background: var(--white); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .section-title { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; color: var(--primary); font-weight: 700; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
        .nav { display:flex; justify-content:space-around; background:var(--white); padding:15px; border-top:1px solid #ccc; position:fixed; bottom:0; width:100%; z-index: 2000; }
        .nav button { background:none; border:none; font-size:24px; cursor: pointer; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 600; cursor: pointer; }
        .player-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f1f5f9; }
        
        /* Lavagna Tattica Aggiornata */
        .court-container { position: relative; width: 300px; height: 500px; margin: 10px auto; touch-action: none; background: #3b82f6; border: 5px solid white; border-radius: 4px; }
        #tacticsCanvas { position: absolute; top: 0; left: 0; z-index: 1; cursor: crosshair; }
        .player-circle { width: 34px; height: 34px; background: var(--primary); color: white; border-radius: 50%; position: absolute; display: flex; align-items: center; justify-content: center; font-weight: bold; z-index: 10; cursor: move; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.4); }
        
        .toolbar { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .btn-t { padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; background: white; cursor: pointer; font-weight: bold; }
        .btn-t.active { background: var(--secondary); color: white; border-color: var(--secondary); }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 3000; }
        .modal-content { background: white; margin: 10% auto; padding: 20px; width: 90%; max-width: 500px; border-radius: 15px; max-height: 80vh; overflow-y: auto; }
        .sync-status { font-size: 0.7rem; color: #10b981; text-align: center; margin-top: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<header>🏐 Volley Manager Cloud
    <div id="syncIndicator" class="sync-status">Dati Sincronizzati</div>
</header>

<div class="container">
    <div id="home">
        <div class="card"><div class="section-title"><span>📅</span> Calendario</div><div id="calendar"></div></div>
        <div class="card"><div class="section-title"><span>📊</span> Statistiche Presenze</div><div style="height: 250px;"><canvas id="statsChart"></canvas></div></div>
    </div>

    <div id="team" class="hidden">
        <div class="card" id="playerFormCard">
            <h3>Gestione Atleta</h3>
            <input type="hidden" id="editPlayerId">
            <input id="pName" placeholder="Nome completo">
            <select id="pRole">
                <option value="Palleggiatore">Palleggiatore</option>
                <option value="Schiacciatore">Schiacciatore</option>
                <option value="Centrale">Centrale</option>
                <option value="Opposto">Opposto</option>
                <option value="Libero">Libero</option>
            </select>
            <input type="date" id="pBirth">
            <button class="btn-main" onclick="savePlayer()">Salva Giocatrice</button>
        </div>
        <div class="card" id="fullPlayerList"></div>
    </div>

    <div id="tactics" class="hidden">
        <div class="card">
            <div class="section-title"><span>📋</span> Lavagna Schemi</div>
            <div class="toolbar">
                <button id="btnMove" class="btn-t active" onclick="setTool('move')">🖐️ Muovi</button>
                <button id="btnDraw" class="btn-t" onclick="setTool('draw')">🏹 Frecce</button>
                <button class="btn-t" onclick="clearArrows()">🗑️ Pulisci</button>
            </div>
            <div class="court-container" id="courtFrame">
                <canvas id="tacticsCanvas" width="300" height="500"></canvas>
                <!-- Posizioni Iniziali Standard -->
                <div class="player-circle" style="top:410px; left:133px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">6</div>
                <div class="player-circle" style="top:55px; left:133px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">3</div>
                <div class="player-circle" style="top:150px; left:30px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">4</div>
                <div class="player-circle" style="top:150px; right:30px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">2</div>
                <div class="player-circle" style="top:410px; left:30px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">5</div>
                <div class="player-circle" style="top:410px; right:30px;" onmousedown="dragPlayer(this)" ontouchstart="dragPlayer(this)">1</div>
            </div>
        </div>
    </div>
</div>

<!-- MODALI -->
<div id="trainingModal" class="modal">
    <div class="modal-content">
        <h3>Nuovo Allenamento</h3>
        <p id="selDateText"></p>
        <input type="time" id="startTime" value="18:30">
        <input type="text" id="location" placeholder="Luogo...">
        <button class="btn-main" onclick="saveTraining()">Salva</button>
        <button onclick="closeModal('trainingModal')">Chiudi</button>
    </div>
</div>

<div id="attModal" class="modal">
    <div class="modal-content"><h3>Appello</h3><div id="attPlayersList"></div><button class="btn-main" onclick="closeModal('attModal')">Salva e Chiudi</button></div>
</div>

<div class="nav"><button onclick="showPage('home')">🏠</button><button onclick="showPage('team')">👥</button><button onclick="showPage('tactics')">🏐</button></div>

<script>
const CLOUD_URL = "https://script.google.com/macros/s/AKfycbw7S3mr9f2cY370nC7bl3bLLe21r9y8OQu1-tRbMX-7opzUYzMVCA42mvLIZ7F1E6en/exec";
let players = [], trainings = [], selectedDate = "", currentTid = null, currentTool = 'move', statsChart = null;

// --- CLOUD SYNC ---
async function syncToCloud() {
    document.getElementById('syncIndicator').innerText = "Sincronizzazione...";
    try {
        await fetch(CLOUD_URL, { method: "POST", body: JSON.stringify({players, trainings}) });
        document.getElementById('syncIndicator').innerText = "Dati Salvati nel Cloud";
    } catch(e) { document.getElementById('syncIndicator').innerText = "Errore Sincronizzazione"; }
}

async function loadFromCloud() {
    try {
        const res = await fetch(CLOUD_URL);
        const data = await res.json();
        if(data) { players = data.players || []; trainings = data.trainings || []; }
        renderCalendar(); updateStats(); renderFullList();
    } catch(e) { console.log("Caricamento fallito"); }
}

function showPage(page) {
    document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
    document.getElementById(page).classList.remove('hidden');
    if(page === 'home') { renderCalendar(); updateStats(); }
    if(page === 'tactics') setTimeout(drawVolleyCourt, 50);
}

// --- CALENDARIO E SQUADRA ---
function savePlayer() {
    const name = document.getElementById("pName").value;
    if(!name) return;
    players.push({ id: Date.now(), name, role: document.getElementById("pRole").value, birth: document.getElementById("pBirth").value });
    document.getElementById("pName").value = ""; renderFullList(); syncToCloud();
}

function renderFullList() { document.getElementById("fullPlayerList").innerHTML = players.map(p => `<div class="player-row"><span>${p.name}</span><button onclick="deletePlayer(${p.id})">🗑️</button></div>`).join(""); }
function deletePlayer(id) { if(confirm("Eliminare?")) { players = players.filter(p => p.id !== id); syncToCloud(); renderFullList(); } }

function renderCalendar() {
    new FullCalendar.Calendar(document.getElementById('calendar'), {
        initialView: 'dayGridMonth', locale: 'it',
        events: trainings.map(t => ({ id: t.id, title: `🏐 ${t.startTime}`, start: t.date })),
        dateClick: (info) => { selectedDate = info.dateStr; document.getElementById('selDateText').innerText = info.dateStr; document.getElementById('trainingModal').style.display='block'; },
        eventClick: (info) => openAtt(info.event.id)
    }).render();
}

function saveTraining() {
    trainings.push({ id: "T"+Date.now(), date: selectedDate, startTime: document.getElementById('startTime').value, location: document.getElementById('location').value, attendance: {} });
    closeModal('trainingModal'); renderCalendar(); syncToCloud();
}

function openAtt(tid) {
    currentTid = tid; const t = trainings.find(x => x.id == tid);
    document.getElementById('attPlayersList').innerHTML = players.map(p => {
        const s = t.attendance[p.name] || "presente";
        return `<div class="att-row" style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>${p.name}</span>
        <select onchange="updateAtt('${p.name}', this.value)" style="width:auto;">
            <option value="presente" ${s==='presente'?'selected':''}>✅ Pres.</option>
            <option value="assente" ${s==='assente'?'selected':''}>❌ Ass.</option>
            <option value="gita" ${s==='gita'?'selected':''}>🎒 Gita</option>
            <option value="infortunio" ${s==='infortunio'?'selected':''}>🤕 Inf.</option>
            <option value="malattia" ${s==='malattia'?'selected':''}>🤒 Mal.</option>
        </select></div>`;
    }).join("");
    document.getElementById('attModal').style.display='block';
}

function updateAtt(pname, status) {
    const t = trainings.find(x => x.id == currentTid);
    t.attendance[pname] = status; syncToCloud();
}

function updateStats() {
    const ctx = document.getElementById('statsChart').getContext('2d');
    const data = players.map(p => {
        const total = trainings.length; if(total === 0) return 0;
        const pres = trainings.filter(t => t.attendance[p.name] === "presente" || !t.attendance[p.name]).length;
        return Math.round((pres/total)*100);
    });
    if(statsChart) statsChart.destroy();
    statsChart = new Chart(ctx, { type: 'bar', data: { labels: players.map(p => p.name), datasets: [{ label: '% Presenze', data: data, backgroundColor: '#1e3a8a' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } } });
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }

// --- LAVAGNA TATTICA AVANZATA ---
const canvas = document.getElementById('tacticsCanvas');
const ctx = canvas.getContext('2d');
let drawing = false, startX, startY;

function drawVolleyCourt() {
    ctx.clearRect(0, 0, 300, 500);
    ctx.strokeStyle = "white";
    ctx.lineWidth = 3;
    
    // Linee perimetrali (già fatte dal CSS border, ma le rinforziamo)
    ctx.strokeRect(0, 0, 300, 500);
    
    // Linea di metà campo (Rete)
    ctx.beginPath();
    ctx.moveTo(0, 250); ctx.lineTo(300, 250);
    ctx.stroke();

    // Linee d'attacco (3 metri)
    // In un campo lungo 18m (500px), 3m sono circa 83px dalla rete
    ctx.setLineDash([5, 5]); // Tratteggiata
    ctx.beginPath();
    ctx.moveTo(0, 167); ctx.lineTo(300, 167); // Attacco superiore
    ctx.moveTo(0, 333); ctx.lineTo(300, 333); // Attacco inferiore
    ctx.stroke();
    ctx.setLineDash([]); // Torna continua
}

function setTool(t) {
    currentTool = t;
    document.getElementById('btnMove').classList.toggle('active', t==='move');
    document.getElementById('btnDraw').classList.toggle('active', t==='draw');
}

function clearArrows() {
    drawVolleyCourt();
}

// Gestione Frecce
canvas.addEventListener('mousedown', sDraw);
canvas.addEventListener('mouseup', eDraw);
canvas.addEventListener('touchstart', (e) => sDraw(e.touches[0]));
canvas.addEventListener('touchend', (e) => eDraw(e.changedTouches[0]));

function sDraw(e) {
    if(currentTool !== 'draw') return;
    drawing = true;
    const r = canvas.getBoundingClientRect();
    startX = e.clientX - r.left; startY = e.clientY - r.top;
}

function eDraw(e) {
    if(!drawing) return;
    const r = canvas.getBoundingClientRect();
    const ex = e.clientX - r.left; const ey = e.clientY - r.top;
    drawArrow(startX, startY, ex, ey);
    drawing = false;
}

function drawArrow(fx, fy, tx, ty) {
    const headlen = 12;
    const angle = Math.atan2(ty - fy, tx - fx);
    ctx.strokeStyle = "yellow";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    // Punta freccia
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - headlen * Math.cos(angle - Math.PI / 6), ty - headlen * Math.sin(angle - Math.PI / 6));
    ctx.moveTo(tx, ty);
    ctx.lineTo(tx - headlen * Math.cos(angle + Math.PI / 6), ty - headlen * Math.sin(angle + Math.PI / 6));
    ctx.stroke();
}

function dragPlayer(el) {
    el.onmousedown = el.ontouchstart = (e) => {
        if(currentTool !== 'move') return;
        e.preventDefault();
        let x = e.clientX || e.touches[0].clientX;
        let y = e.clientY || e.touches[0].clientY;
        document.onmousemove = document.ontouchmove = (ev) => {
            let nx = ev.clientX || ev.touches[0].clientX;
            let ny = ev.clientY || ev.touches[0].clientY;
            el.style.left = (el.offsetLeft + (nx - x)) + "px";
            el.style.top = (el.offsetTop + (ny - y)) + "px";
            x = nx; y = ny;
        };
        document.onmouseup = document.ontouchend = () => { document.onmousemove = document.ontouchmove = null; };
    };
}

window.onload = loadFromCloud;
</script>
</body>
</html>

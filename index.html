<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Volley Manager Pro - Full Control</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <style>
        :root { --primary: #1e3a8a; --secondary: #f59e0b; --bg: #f1f5f9; --white: #ffffff; --absent: #ef4444; --present: #10b981; }
        body { font-family: 'Inter', sans-serif; margin:0; background: var(--bg); padding-bottom: 80px; }
        header { background: var(--primary); color: white; padding: 1rem; text-align: center; font-weight: bold; }
        .container { padding: 15px; max-width: 900px; margin: auto; }
        .card { background: var(--white); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        
        /* Navigazione */
        .nav { display:flex; justify-content:space-around; background:var(--white); padding:15px; border-top:1px solid #ccc; position:fixed; bottom:0; width:100%; z-index: 2000; }
        .nav button { background:none; border:none; font-size:24px; cursor: pointer; }

        /* Form Presenze */
        .attendance-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .status-select { padding: 5px; border-radius: 5px; border: 1px solid #ddd; }
        
        /* Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 3000; overflow-y: auto; }
        .modal-content { background: white; margin: 5% auto; padding: 20px; width: 90%; max-width: 500px; border-radius: 15px; }

        input, select { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .hidden { display: none; }
        
        #calendar { background: white; padding: 10px; border-radius: 12px; height: 550px; }
    </style>
</head>
<body>

<header>🏐 Volley Manager Control</header>

<div class="container">
    <!-- HOME & CALENDARIO -->
    <div id="home">
        <div class="card">
            <h3 style="margin-top:0">📅 Calendario Allenamenti</h3>
            <div id="calendar"></div>
        </div>
    </div>

    <!-- SQUADRA -->
    <div id="team" class="hidden">
        <div class="card">
            <h3>Gestione Giocatrici</h3>
            <input id="pName" placeholder="Nome completo">
            <select id="pRole">
                <option value="Palleggiatore">Palleggiatore</option>
                <option value="Schiacciatore">Schiacciatore</option>
                <option value="Centrale">Centrale</option>
                <option value="Opposto">Opposto</option>
                <option value="Libero">Libero</option>
            </select>
            <button class="btn-main" onclick="addPlayer()">Aggiungi Giocatrice</button>
        </div>
        <div class="card" id="fullPlayerList"></div>
    </div>
</div>

<!-- MODAL NUOVO ALLENAMENTO -->
<div id="trainingModal" class="modal">
    <div class="modal-content">
        <h3>Nuovo Allenamento</h3>
        <p id="selectedDateText"></p>
        <label>Inizio:</label><input type="time" id="startTime" value="18:30">
        <label>Fine:</label><input type="time" id="endTime" value="20:30">
        <label>Luogo:</label><input type="text" id="location" placeholder="Palestra Comunale...">
        <button class="btn-main" onclick="saveTraining()">Salva Allenamento</button>
        <button onclick="closeModal('trainingModal')" style="width:100%; border:none; margin-top:10px; background:none; color:gray;">Annulla</button>
    </div>
</div>

<!-- MODAL APPELLO (PRESENZE) -->
<div id="attendanceModal" class="modal">
    <div class="modal-content">
        <h3 id="attTitle">Registro Presenze</h3>
        <p id="attInfo" style="font-size: 0.9rem; color: #666;"></p>
        <div id="attendanceList"></div>
        <button class="btn-main" onclick="closeModal('attendanceModal')">Chiudi e Salva</button>
    </div>
</div>

<div class="nav">
    <button onclick="showPage('home')">🏠</button>
    <button onclick="showPage('team')">👥</button>
</div>

<script>
let players = JSON.parse(localStorage.getItem("players")) || [];
let trainings = JSON.parse(localStorage.getItem("trainings")) || [];
let currentSelectedDate = "";
let currentTrainingId = null;

function showPage(page) {
    document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
    document.getElementById(page).classList.remove('hidden');
    if(page === 'home') renderCalendar();
    if(page === 'team') renderPlayers();
}

// --- CALENDARIO ---
function renderCalendar() {
    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'it',
        events: trainings.map(t => ({
            id: t.id,
            title: `🏐 ${t.startTime} @ ${t.location}`,
            start: t.date,
            backgroundColor: '#1e3a8a'
        })),
        dateClick: (info) => {
            currentSelectedDate = info.dateStr;
            document.getElementById('selectedDateText').innerText = "Data: " + info.dateStr;
            document.getElementById('trainingModal').style.display = 'block';
        },
        eventClick: (info) => {
            openAttendance(info.event.id);
        }
    });
    calendar.render();
}

// --- SALVATAGGIO ALLENAMENTO ---
function saveTraining() {
    const training = {
        id: "T" + Date.now(),
        date: currentSelectedDate,
        startTime: document.getElementById('startTime').value,
        endTime: document.getElementById('endTime').value,
        location: document.getElementById('location').value || "N/D",
        attendance: {} // { playerName: status }
    };
    trainings.push(training);
    localStorage.setItem("trainings", JSON.stringify(trainings));
    closeModal('trainingModal');
    renderCalendar();
}

// --- GESTIONE PRESENZE ---
function openAttendance(id) {
    currentTrainingId = id;
    const training = trainings.find(t => t.id == id);
    document.getElementById('attTitle').innerText = "Appello " + training.date;
    document.getElementById('attInfo').innerText = `Dalle ${training.startTime} alle ${training.endTime} - Luogo: ${training.location}`;
    
    const list = document.getElementById('attendanceList');
    list.innerHTML = players.map(p => {
        const status = training.attendance[p.name] || "presente";
        return `
            <div class="attendance-row">
                <span><strong>${p.name}</strong></span>
                <select class="status-select" onchange="updateStatus('${p.name}', this.value)">
                    <option value="presente" ${status === 'presente' ? 'selected' : ''}>✅ Presente</option>
                    <option value="assente" ${status === 'assente' ? 'selected' : ''}>❌ Assente</option>
                    <option value="gita" ${status === 'gita' ? 'selected' : ''}>🎒 Gita</option>
                    <option value="infortunio" ${status === 'infortunio' ? 'selected' : ''}>🤕 Infortunio</option>
                    <option value="malattia" ${status === 'malattia' ? 'selected' : ''}>🤒 Malattia</option>
                </select>
            </div>
        `;
    }).join("");
    
    document.getElementById('attendanceModal').style.display = 'block';
}

function updateStatus(playerName, status) {
    const training = trainings.find(t => t.id == currentTrainingId);
    training.attendance[playerName] = status;
    localStorage.setItem("trainings", JSON.stringify(trainings));
}

// --- GESTIONE GIOCATRICI ---
function addPlayer() {
    const name = document.getElementById('pName').value;
    if(!name) return;
    players.push({ name, role: document.getElementById('pRole').value });
    localStorage.setItem("players", JSON.stringify(players));
    document.getElementById('pName').value = "";
    renderPlayers();
}

function renderPlayers() {
    document.getElementById('fullPlayerList').innerHTML = players.map(p => `<div>${p.name} (${p.role})</div>`).join("");
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }

window.onload = () => { showPage('home'); };
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Volley Manager Cloud Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

    <style>
        :root { --primary: #1e3a8a; --secondary: #f59e0b; --bg: #f1f5f9; --white: #ffffff; --danger: #ef4444; }
        body { font-family: 'Inter', sans-serif; margin:0; background: var(--bg); color: #1e293b; padding-bottom: 80px; }
        header { background: var(--primary); color: white; padding: 1rem; text-align: center; font-weight: bold; border-bottom: 4px solid var(--secondary); }
        .container { padding: 15px; max-width: 900px; margin: auto; }
        .card { background: var(--white); padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .section-title { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; color: var(--primary); font-weight: 700; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
        
        #calendar { min-height: 400px; background: white; padding: 10px; border-radius: 8px; }
        .nav { display:flex; justify-content:space-around; background:var(--white); padding:15px; border-top:1px solid #ccc; position:fixed; bottom:0; width:100%; z-index: 4000; }
        .nav button { background:none; border:none; font-size:24px; cursor: pointer; }
        
        .btn-main { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-danger { background: var(--danger) !important; margin-top: 5px; }
        .btn-warning { background: var(--secondary) !important; color: white; margin-top: 5px; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 5000; }
        .modal-content { background: white; margin: 5% auto; padding: 20px; width: 90%; max-width: 500px; border-radius: 15px; max-height: 85vh; overflow-y: auto; }
        .hidden { display: none !important; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        
        .player-item { display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid #eee; }
    </style>
</head>
<body>

<header>🏐 Volley Manager Cloud Pro</header>

<div class="container">
    <div id="home">
        <div class="card"><div class="section-title"><span>📅</span> Calendario</div><div id="calendar"></div></div>
        <div class="card"><div class="section-title"><span>📊</span> % Presenze</div><div style="height: 250px;"><canvas id="statsChart"></canvas></div></div>
    </div>

    <div id="team" class="hidden">
        <div class="card">
            <h3 id="formTitle">Nuova Atleta</h3>
            <input id="pName" placeholder="Nome completo">
            <input type="date" id="pDob">
            <select id="pRole">
                <option value="P">Palleggiatore</option><option value="S">Schiacciatore</option><option value="C">Centrale</option><option value="O">Opposto</option><option value="L">Libero</option>
            </select>
            <input type="hidden" id="editingId">
            <button class="btn-main" onclick="savePlayer()">Salva Atleta</button>
        </div>
        <div class="card"><div id="fullPlayerList"></div></div>
    </div>
</div>

<!-- MODALE NUOVO ALLENAMENTO -->
<div id="trainingModal" class="modal">
    <div class="modal-content">
        <h3>Pianifica Allenamento</h3>
        <p id="selDateText" style="font-weight: bold;"></p>
        <div style="display: flex; gap: 10px;">
            <div style="flex:1;"><label>Inizio:</label><input type="time" id="startTime" value="18:30"></div>
            <div style="flex:1;"><label>Fine:</label><input type="time" id="endTime" value="20:30"></div>
        </div>
        <div style="margin-top: 10px; padding: 10px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
            <label><strong>Ripeti ogni 7 giorni per:</strong></label>
            <input type="number" id="repeatWeeks" value="1" min="1" max="52">
            <p style="font-size: 0.75rem; color: #64748b;">Esempio: 4 crea l'allenamento per un mese intero.</p>
        </div>
        <button class="btn-main" onclick="saveTraining()">Crea Allenamenti</button>
        <button onclick="closeModal('trainingModal')" style="width:100%; border:none; background:none; margin-top:10px;">Annulla</button>
    </div>
</div>

<!-- MODALE APPELLO -->
<div id="attModal" class="modal">
    <div class="modal-content">
        <h3 id="attTitle">Dettagli</h3>
        <button class="btn-main" style="background:#10b981; margin-bottom:15px;" onclick="setAllPresent()">✅ Segna Tutte Presenti</button>
        <div id="attPlayersList"></div>
        <hr>
        <div style="background: #fff1f2; padding: 12px; border-radius: 8px;">
            <button class="btn-main btn-danger" onclick="deleteTraining()">🗑️ Elimina Solo Oggi</button>
            <button class="btn-main btn-warning" onclick="deleteSeries()">📅 Elimina Serie Settimanale</button>
        </div>
        <button class="btn-main" onclick="closeModal('attModal')" style="background: #64748b;">Esci</button>
    </div>
</div>

<div class="nav"><button onclick="showPage('home')">🏠</button><button onclick="showPage('team')">👥</button></div>

<script>
const CLOUD_URL = "https://script.google.com/macros/s/AKfycbw7S3mr9f2cY370nC7bl3bLLe21r9y8OQu1-tRbMX-7opzUYzMVCA42mvLIZ7F1E6en/exec";
let players = [], trainings = [], selectedDate = "", currentTid = null, calendar = null, statsChart = null;

// Utility per formattare la data correttamente senza errori di fuso orario
function formatDate(date) {
    let d = new Date(date), month = '' + (d.getMonth() + 1), day = '' + d.getDate(), year = d.getFullYear();
    if (month.length < 2) month = '0' + month;
    if (day.length < 2) day = '0' + day;
    return [year, month, day].join('-');
}

async function syncToCloud() {
    try { await fetch(CLOUD_URL, { method: "POST", body: JSON.stringify({players, trainings}) }); renderCalendar(); updateStats(); } catch(e) { console.error("Errore Cloud"); }
}

async function loadFromCloud() {
    try {
        const res = await fetch(CLOUD_URL); const data = await res.json();
        if(data) { players = data.players || []; trainings = data.trainings || []; }
        renderFullList(); showPage('home');
    } catch(e) { showPage('home'); }
}

function showPage(page) {
    document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
    document.getElementById(page).classList.remove('hidden');
    if(page === 'home') { renderCalendar(); updateStats(); }
}

function renderCalendar() {
    const calendarEl = document.getElementById('calendar');
    if (calendar) calendar.destroy();
    calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth', locale: 'it', height: 'auto',
        events: trainings.map(t => ({ id: t.id, title: `${t.startTime}-${t.endTime}`, start: t.date })),
        dateClick: (info) => { selectedDate = info.dateStr; document.getElementById('selDateText').innerText = "Data: " + info.dateStr; document.getElementById('trainingModal').style.display='block'; },
        eventClick: (info) => openAtt(info.event.id)
    });
    calendar.render();
}

function saveTraining() {
    const start = document.getElementById('startTime').value, end = document.getElementById('endTime').value;
    const reps = parseInt(document.getElementById('repeatWeeks').value) || 1;
    
    for(let i=0; i<reps; i++) {
        let d = new Date(selectedDate);
        d.setDate(d.getDate() + (i * 7));
        trainings.push({ id: "T" + Date.now() + i, date: formatDate(d), startTime: start, endTime: end, attendance: {} });
    }
    closeModal('trainingModal'); syncToCloud();
}

// --- FUNZIONE CORRETTA PER ELIMINAZIONE SERIE ---
function deleteSeries() {
    const t = trainings.find(x => x.id == currentTid);
    if (!t) return;

    const numWeeks = prompt("Quante settimane vuoi eliminare a partire da questa data?", "4");
    if(!numWeeks || isNaN(numWeeks)) return;

    const weeks = parseInt(numWeeks);
    const datesToDelete = [];

    // Generiamo l'elenco delle date esatte da rimuovere
    for(let i=0; i < weeks; i++) {
        let d = new Date(t.date);
        d.setDate(d.getDate() + (i * 7));
        datesToDelete.push(formatDate(d));
    }

    if(confirm(`Verranno rimossi gli allenamenti trovati nelle date: ${datesToDelete.join(', ')}. Confermi?`)) {
        trainings = trainings.filter(item => !datesToDelete.includes(item.date));
        closeModal('attModal');
        syncToCloud();
    }
}

function deleteTraining() {
    if(confirm("Eliminare l'allenamento di oggi?")) { trainings = trainings.filter(t => t.id !== currentTid); closeModal('attModal'); syncToCloud(); }
}

function openAtt(tid) {
    currentTid = tid; const t = trainings.find(x => x.id == tid);
    document.getElementById('attTitle').innerText = `${t.date} (${t.startTime}-${t.endTime})`;
    document.getElementById('attPlayersList').innerHTML = players.map(p => {
        const s = t.attendance[p.name] || "presente";
        return `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <span>${p.name}</span>
            <select onchange="updateAtt('${p.name}', this.value)" style="width:auto; padding:5px;">
                <option value="presente" ${s==='presente'?'selected':''}>✅</option>
                <option value="assente" ${s==='assente'?'selected':''}>❌</option>
                <option value="infortunio" ${s==='infortunio'?'selected':''}>🤕</option>
                <option value="malattia" ${s==='malattia'?'selected':''}>🤒</option>
                <option value="gita" ${s==='gita'?'selected':''}>🚌</option>
            </select></div>`;
    }).join("");
    document.getElementById('attModal').style.display='block';
}

function updateAtt(pname, status) { const t = trainings.find(x => x.id == currentTid); t.attendance[pname] = status; syncToCloud(); }
function setAllPresent() { const t = trainings.find(x => x.id == currentTid); players.forEach(p => t.attendance[p.name] = "presente"); openAtt(currentTid); syncToCloud(); }

function savePlayer() {
    const n = document.getElementById("pName").value, d = document.getElementById("pDob").value, r = document.getElementById("pRole").value, eid = document.getElementById("editingId").value;
    if(!n) return;
    if(eid) { const idx = players.findIndex(p => p.id == eid); players[idx].name = n; players[idx].dob = d; players[idx].role = r; }
    else { players.push({ id: Date.now(), name: n, dob: d, role: r, attendance: {} }); }
    resetForm(); renderFullList(); syncToCloud();
}

function renderFullList() {
    document.getElementById("fullPlayerList").innerHTML = players.map(p => `
        <div class="player-item">
            <div><strong>${p.name}</strong><br><small>${p.dob || '---'}</small></div>
            <button onclick="editPlayer(${p.id})">✏️</button>
        </div>`).join("");
}

function editPlayer(id) {
    const p = players.find(x => x.id == id);
    document.getElementById("pName").value = p.name; document.getElementById("pDob").value = p.dob || "";
    document.getElementById("pRole").value = p.role; document.getElementById("editingId").value = p.id;
    showPage('team');
}

function resetForm() { document.getElementById("pName").value = ""; document.getElementById("pDob").value = ""; document.getElementById("editingId").value = ""; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function updateStats() {
    const ctx = document.getElementById('statsChart').getContext('2d');
    const data = players.map(p => {
        const total = trainings.length; if(total === 0) return 0;
        const pres = trainings.filter(t => t.attendance[p.name] === "presente").length;
        return Math.round((pres/total)*100);
    });
    if(statsChart) statsChart.destroy();
    statsChart = new Chart(ctx, { type: 'bar', data: { labels: players.map(p => p.name), datasets: [{ label: '% Presenze', data: data, backgroundColor: '#1e3a8a' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } } });
}

window.onload = loadFromCloud;
</script>
</body>
</html>
